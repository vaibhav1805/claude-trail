name: Build binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned rather than 'lts/*': a floating LTS silently jumped from
          # Node 22 to 24 between the v0.1.2 and v0.2.0 tag builds, and npm
          # 11 (bundled with 24) enforces stricter package-lock.json sync
          # for nested optionalDependencies than npm 10 did — broke `npm ci`
          # on all 4 platforms with no code change on our end. Bump this
          # deliberately, testing `npm ci` locally first, rather than
          # inheriting whatever GitHub's runners consider "latest LTS" today.
          node-version: '22'

      - run: npm ci

      - run: npm run build:binary

      - uses: actions/upload-artifact@v4
        with:
          name: claude-trail-${{ matrix.label }}
          path: dist/claude-trail-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
